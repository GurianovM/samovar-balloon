<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 720" width="600" height="720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7fb8e8"/>
      <stop offset="1" stop-color="#f6d9a8"/>
    </linearGradient>
    <radialGradient id="brass" cx="0.35" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff1b8"/>
      <stop offset="0.45" stop-color="#e0a93b"/>
      <stop offset="1" stop-color="#8a5a12"/>
    </radialGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a0e"/>
      <stop offset="0.5" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#5a3a0e"/>
    </linearGradient>
    <clipPath id="envelope">
      <path d="M300 40 C430 40 500 130 500 230 C500 330 400 390 340 420 L260 420 C200 390 100 330 100 230 C100 130 170 40 300 40 Z"/>
    </clipPath>
  </defs>

  <rect width="600" height="720" fill="url(#sky)"/>

  <!-- облака -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="80" cy="520" rx="60" ry="22"/>
    <ellipse cx="120" cy="505" rx="45" ry="25"/>
    <ellipse cx="520" cy="110" rx="55" ry="20"/>
    <ellipse cx="555" cy="98" rx="38" ry="20"/>
    <ellipse cx="500" cy="610" rx="70" ry="24"/>
    <ellipse cx="545" cy="595" rx="45" ry="24"/>
  </g>

  <!-- оболочка -->
  <g clip-path="url(#envelope)">
    <rect x="100" y="40" width="400" height="380" fill="#c0392b"/>
    <path d="M300 40 C250 120 230 300 270 420 L330 420 C370 300 350 120 300 40 Z" fill="#f4e4c1"/>
    <path d="M190 60 C150 160 160 330 220 420 L245 420 C200 320 195 170 230 50 Z" fill="#f4e4c1"/>
    <path d="M410 60 C450 160 440 330 380 420 L355 420 C400 320 405 170 370 50 Z" fill="#f4e4c1"/>
    <rect x="100" y="200" width="400" height="14" fill="#2c3e50" opacity="0.35"/>
    <!-- заплатка -->
    <rect x="395" y="250" width="44" height="34" fill="#6d8f3a" transform="rotate(-12 417 267)"/>
    <path d="M398 252 l40 30 M400 280 l36 -26" stroke="#3b4f1f" stroke-width="2" stroke-dasharray="4 3" transform="rotate(-12 417 267)"/>
  </g>
  <path d="M300 40 C430 40 500 130 500 230 C500 330 400 390 340 420 L260 420 C200 390 100 330 100 230 C100 130 170 40 300 40 Z" fill="none" stroke="#5b1a12" stroke-width="4"/>
  <ellipse cx="300" cy="420" rx="40" ry="8" fill="#3a1d10"/>

  <!-- стропы -->
  <g stroke="#4a3520" stroke-width="2.5">
    <line x1="262" y1="420" x2="222" y2="520"/>
    <line x1="338" y1="420" x2="378" y2="520"/>
    <line x1="280" y1="421" x2="262" y2="500"/>
    <line x1="320" y1="421" x2="338" y2="500"/>
  </g>

  <!-- труба самовара уходит в оболочку -->
  <rect x="288" y="420" width="24" height="70" fill="url(#pipe)"/>
  <!-- горячий воздух -->
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.7" stroke-linecap="round">
    <path d="M300 410 c-10 -15 10 -25 0 -40"/>
    <path d="M286 400 c-8 -12 8 -20 0 -32"/>
    <path d="M314 400 c-8 -12 8 -20 0 -32"/>
  </g>

  <!-- пилот на крышке -->
  <g>
    <rect x="232" y="470" width="34" height="34" rx="8" fill="#6b3f1f"/>
    <circle cx="249" cy="458" r="17" fill="#f1c9a0"/>
    <path d="M232 452 a17 17 0 0 1 34 0 z" fill="#5a3a22"/>
    <rect x="236" y="452" width="26" height="9" rx="4" fill="#2c3e50"/>
    <circle cx="243" cy="456" r="4" fill="#9fd3f0"/>
    <circle cx="255" cy="456" r="4" fill="#9fd3f0"/>
    <path d="M244 467 q5 4 10 0" stroke="#7a3b1c" stroke-width="2" fill="none"/>
    <path d="M266 450 q20 4 34 -6" stroke="#e8e0d0" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- корпус самовара -->
  <path d="M222 520 L378 520 L370 540 L230 540 Z" fill="#8a5a12"/>
  <ellipse cx="300" cy="488" rx="56" ry="14" fill="#b07a1e"/>
  <path d="M244 490 Q238 505 222 520 L378 520 Q362 505 356 490 Z" fill="url(#brass)"/>
  <path d="M230 540 C200 580 205 640 245 665 L355 665 C395 640 400 580 370 540 Z" fill="url(#brass)" stroke="#6b4410" stroke-width="3"/>
  <!-- медали -->
  <g fill="#f7dc6f" stroke="#8a5a12" stroke-width="2">
    <circle cx="275" cy="590" r="10"/>
    <circle cx="300" cy="582" r="10"/>
    <circle cx="325" cy="590" r="10"/>
  </g>
  <!-- ручки -->
  <path d="M232 560 q-34 6 -28 44 q4 10 12 6" fill="none" stroke="#2b1a0a" stroke-width="7" stroke-linecap="round"/>
  <path d="M368 560 q34 6 28 44 q-4 10 -12 6" fill="none" stroke="#2b1a0a" stroke-width="7" stroke-linecap="round"/>
  <!-- кран -->
  <path d="M300 630 L300 648 L330 650 L334 664" fill="none" stroke="#6b4410" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="290" y="622" width="22" height="10" rx="3" fill="#2b1a0a"/>
  <!-- ножки -->
  <g fill="#6b4410">
    <path d="M250 665 l-14 34 l18 0 l10 -34 z"/>
    <path d="M350 665 l14 34 l-18 0 l-10 -34 z"/>
    <path d="M292 665 l0 34 l16 0 l0 -34 z"/>
  </g>
  <!-- чашка на ниточке -->
  <line x1="334" y1="664" x2="334" y2="690" stroke="#4a3520" stroke-width="1.5"/>
  <path d="M322 690 h24 l-3 16 h-18 z" fill="#ffffff" stroke="#2c3e50" stroke-width="2"/>
  <path d="M346 694 q8 2 0 8" fill="none" stroke="#2c3e50" stroke-width="2"/>

  <!-- пар из чашки -->
  <g fill="#ffffff" opacity="0.8">
    <circle cx="420" cy="560" r="10"/>
    <circle cx="436" cy="548" r="13"/>
    <circle cx="456" cy="540" r="9"/>
  </g>

  <text x="300" y="30" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="bold" fill="#2c1a0a">Самоварный аэростат «Пыхтун»</text>
</svg>
